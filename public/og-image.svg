<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1C1C1A"/>

  <!-- Texture overlay — subtle grid -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1C1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A1F1A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B85C38;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B85C38;stop-opacity:0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient glow — terracotta -->
  <ellipse cx="900" cy="200" rx="400" ry="300" fill="#B85C38" opacity="0.07"/>
  <!-- Ambient glow — forest green -->
  <ellipse cx="150" cy="500" rx="300" ry="250" fill="#2D4B37" opacity="0.1"/>

  <!-- Left accent bar -->
  <rect x="80" y="80" width="4" height="470" fill="#B85C38" opacity="0.6"/>

  <!-- Top accent line -->
  <rect x="80" y="80" width="600" height="2" fill="url(#accentLine)"/>

  <!-- Brand name — KARRCHOLAI -->
  <text x="112" y="200" font-family="Georgia, serif" font-size="88" font-weight="700"
    fill="#FFFFFF" letter-spacing="-2" opacity="0.95">KARRCHOLAI</text>

  <!-- Divider line -->
  <rect x="112" y="228" width="400" height="2" fill="#B85C38" opacity="0.8"/>

  <!-- Tagline -->
  <text x="112" y="282" font-family="Arial, sans-serif" font-size="22" font-weight="400"
    fill="#B85C38" letter-spacing="6" opacity="0.9">CONSTRUCTION &amp; ARCHITECTURE</text>

  <!-- Description -->
  <text x="112" y="346" font-family="Arial, sans-serif" font-size="26" font-weight="300"
    fill="#FFFFFF" opacity="0.65">Premium Residential Construction in Tamil Nadu</text>
  <text x="112" y="388" font-family="Arial, sans-serif" font-size="26" font-weight="300"
    fill="#FFFFFF" opacity="0.65">Vastu Tools · Manaiyadi Sastram · Solar · Rainwater</text>

  <!-- Service pills -->
  <rect x="112" y="440" width="155" height="36" rx="18" fill="#B85C38" opacity="0.2"/>
  <text x="190" y="463" font-family="Arial, sans-serif" font-size="13" font-weight="600"
    fill="#B85C38" text-anchor="middle" letter-spacing="2">RESIDENTIAL</text>

  <rect x="282" y="440" width="120" height="36" rx="18" fill="#2D4B37" opacity="0.3"/>
  <text x="342" y="463" font-family="Arial, sans-serif" font-size="13" font-weight="600"
    fill="#7DBE9A" text-anchor="middle" letter-spacing="2">SOLAR</text>

  <rect x="418" y="440" width="170" height="36" rx="18" fill="#2D4B37" opacity="0.3"/>
  <text x="503" y="463" font-family="Arial, sans-serif" font-size="13" font-weight="600"
    fill="#7DBE9A" text-anchor="middle" letter-spacing="2">RENOVATION</text>

  <rect x="604" y="440" width="90" height="36" rx="18" fill="#B85C38" opacity="0.2"/>
  <text x="649" y="463" font-family="Arial, sans-serif" font-size="13" font-weight="600"
    fill="#B85C38" text-anchor="middle" letter-spacing="2">VASTU</text>

  <!-- Stats block — right side -->
  <rect x="840" y="200" width="1" height="280" fill="#ffffff" opacity="0.08"/>

  <text x="900" y="265" font-family="Arial, sans-serif" font-size="64" font-weight="700"
    fill="#B85C38" text-anchor="middle">12+</text>
  <text x="900" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="400"
    fill="#ffffff" text-anchor="middle" letter-spacing="3" opacity="0.5">YEARS</text>

  <rect x="860" y="330" width="80" height="1" fill="#ffffff" opacity="0.1"/>

  <text x="900" y="395" font-family="Arial, sans-serif" font-size="64" font-weight="700"
    fill="#2D4B37" text-anchor="middle">40+</text>
  <text x="900" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="400"
    fill="#ffffff" text-anchor="middle" letter-spacing="3" opacity="0.5">PROJECTS</text>

  <!-- Bottom domain -->
  <text x="112" y="570" font-family="Arial, sans-serif" font-size="16" font-weight="400"
    fill="#ffffff" opacity="0.3" letter-spacing="2">karrcholai.com</text>

  <!-- Bottom right phone -->
  <text x="1120" y="570" font-family="Arial, sans-serif" font-size="16" font-weight="400"
    fill="#B85C38" opacity="0.6" text-anchor="end" letter-spacing="1">+91-97414-16747</text>

  <!-- Corner decorative element -->
  <rect x="1140" y="80" width="2" height="120" fill="#B85C38" opacity="0.3"/>
  <rect x="1080" y="80" width="62" height="2" fill="#B85C38" opacity="0.3"/>
</svg>
